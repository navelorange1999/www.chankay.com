name: Site Shell Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'site-shell-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site-shell
        run: pnpm --filter @chankay/site-shell build

      - name: Check types
        run: pnpm --filter @chankay/site-shell check-types

      - name: Run tests
        run: pnpm --filter @chankay/site-shell test:run

      - name: Prepare release assets
        if: ${{ github.event_name == 'release' }}
        run: |
          mkdir -p release-assets
          zip -r release-assets/site-shell-browser-assets.zip packages/site-shell/dist
          cp packages/site-shell/dist/tokens.css release-assets/tokens.css

      - name: Publish package
        if: ${{ github.event_name == 'release' }}
        run: pnpm --filter @chankay/site-shell publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload release assets
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/site-shell-browser-assets.zip
            release-assets/tokens.css
