name: Admin Preview Deployment
on:
  push:
    branches: [staging]
jobs:
  Deploy-Preview:
    environment: Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Trigger Vercel Webhook
        run: |
          set -e
          response=$(curl -f -X POST https://api.vercel.com/v1/integrations/deploy/${{secrets.VERCEL_ADMIN_PROJECT_ID}}/${{secrets.VERCEL_ADMIN_WEBHOOK_ID}})
          echo "Response from Vercel: $response"